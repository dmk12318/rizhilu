name: 每日新闻与主编专栏

# 每天 UTC 00:00 运行 = 北京时间早上 8:00。
# GitHub 的定时任务在高峰期可能延迟几分钟到半小时，属正常现象。
on:
  schedule:
    - cron: "0 0 * * *"
  # 推送到 main 也重新发布一次，方便手动改完内容立即生效。
  # 不会造成循环：GitHub 规定用默认 GITHUB_TOKEN 推送所触发的事件
  # 不会再启动新的工作流，所以机器人每天提交的数据不会反过来触发自己。
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_editorial:
        description: 本次只抓新闻、不生成专栏
        type: boolean
        default: false

permissions:
  contents: write      # 把当天数据提交回仓库
  pages: write         # 发布 GitHub Pages
  id-token: write

concurrency:
  group: rizhilu-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEWS_RETENTION_DAYS: "60"   # 云端保留 60 天，方便往前翻；改大这个数会让仓库变大
      # GitHub 的服务器在境外，不需要任何代理，直接放开全部 107 个源
      NEWS_OVERSEAS: "on"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 抓取新闻
        # 推送只负责"把改动发布出去"，不生成新的一期。
        # 否则随便推一次代码就会多产出一期，和早上 8:00 的定时任务打架。
        if: ${{ github.event_name != 'push' }}
        run: npm run fetch

      - name: 生成两类专栏
        # 定时任务必定执行；手动触发可勾选跳过；推送代码时不生成
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_editorial != 'true') }}
        # 专栏失败不能拖垮整期：接口欠费、限流、模型抽风时，新闻照常发布
        continue-on-error: true
        env:
          # 支持两种命名：标准名优先，读不到则退回最初创建的 DAILYNEWS
          EDITORIAL_API_KEY: ${{ secrets.EDITORIAL_API_KEY || secrets.DAILYNEWS }}
          EDITORIAL_BASE_URL: ${{ vars.EDITORIAL_BASE_URL }}
          EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || vars.DAILYNEWS }}
        run: |
          fail=0
          for scope in all world; do
            echo "::group::生成专栏 scope=$scope"
            node scripts/editorial.mjs --scope=$scope || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: 组装站点
        run: |
          mkdir -p _site
          cp -r index.html assets data editorial _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # 提交放在最后并且允许失败：即使仓库没开写入权限，
      # 站点也已经构建完毕，不会因为归档失败而停更。
      - name: 把当天数据提交回仓库
        continue-on-error: true
        run: |
          git config user.name  "rizhilu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data editorial
          git diff --staged --quiet || git commit -m "每日更新 $(date -u +%F)"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
