<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="description" content="日知录 · 每日国内外要闻聚合与主编专栏">
<title>日知录 · 每日要闻</title>
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23b3261e'/><text y='72' x='50' font-size='62' text-anchor='middle' fill='%23fff' font-family='serif'>日</text></svg>">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="masthead" id="masthead">
  <div class="masthead__inner">
    <div class="brand">
      <a class="brand__mark" href="#" id="brandHome">日知录</a>
      <span class="brand__tag">国内外要闻 · 每日一辑 · 主编专栏</span>
    </div>

    <div class="masthead__tools">
      <div class="datenav" role="group" aria-label="切换日期">
        <button class="iconbtn" id="prevDay" title="前一天（←）" aria-label="前一天">‹</button>
        <select class="datenav__select" id="datePick" aria-label="选择某一期" title="跳到某一期"></select>
        <button class="iconbtn" id="nextDay" title="后一天（→）" aria-label="后一天">›</button>
        <button class="iconbtn datenav__latest" id="backLatest" title="回到最新一期" aria-label="回到最新一期" hidden>⤒</button>
      </div>

      <label class="search">
        <input id="search" type="search" placeholder="搜索标题或摘要…（按 / 聚焦）" autocomplete="off">
        <button class="search__clear" id="searchClear" hidden aria-label="清除搜索">×</button>
      </label>

      <div class="toggles">
        <button class="iconbtn" id="themeBtn" title="切换深色/浅色" aria-label="切换主题">◐</button>
        <button class="iconbtn" id="refreshBtn" title="重新载入最新数据" aria-label="重新载入">⟳</button>
      </div>
    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="分类导航"></nav>
</header>

<div class="stale" id="stale" hidden></div>

<main class="page">

  <div id="editorialWrap"></div>

  <section class="briefing" id="briefingSection" hidden>
    <div class="briefing__head">
      <h2 id="briefingTitle">今日速览</h2>
      <span class="briefing__hint">按来源权重与时效自动生成的当日要目</span>
    </div>
    <ol class="briefing__list" id="briefingList"></ol>
  </section>

  <section class="stream">
    <div class="stream__bar">
      <h2 class="stream__title" id="streamTitle">全部</h2>
      <div class="filters">
        <button class="chip" data-filter="unread">未读</button>
        <button class="chip" data-filter="fav">收藏</button>
        <button class="chip" data-filter="zh">仅中文</button>
        <span class="filters__count" id="resultCount"></span>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="loadmore" id="loadmore" hidden>
      <button class="btn" id="loadmoreBtn">加载更多</button>
    </div>
    <p class="empty" id="empty" hidden></p>
  </section>

  <footer class="colophon">
    <div id="sourceNote"></div>
    <div class="colophon__meta">
      <span id="generatedAt"></span> · <span id="windowNote"></span>
    </div>
    <div class="colophon__hint">
      更新数据：<code>npm run fetch</code> · 启动本地服务：<code>npm run serve</code> · 深度整理与评论由主编专栏承担，转载内容版权归原媒体所有。
    </div>
  </footer>
</main>

<button class="totop" id="toTop" hidden aria-label="回到顶部">↑</button>

<script src="assets/app.js"></script>
</body>
</html>
